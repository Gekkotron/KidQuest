name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM tests (domain, data, view models, UI)
        run: ./gradlew :shared:jvmTest :composeApp:jvmTest --stacktrace
      - name: Android build
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: iOS tests and framework link
        run: ./gradlew :shared:iosSimulatorArm64Test :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
